name: Keep Streamlit App Awake

on:
  schedule:
    # Runs at 12:00 UTC every 3 days
    - cron: '0 12 */3 * *'
  workflow_dispatch: # Allows manual trigger from the GitHub Actions tab

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Streamlit URL
        run: |
          curl -sSf -o /dev/null -w "HTTP Status: %{http_code}\n" https://dcfvaluationmodel.streamlit.app/
